name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      # Integration tests start a throwaway PostgreSQL container (Docker is available on ubuntu runners).
      - run: dotnet test --no-build
